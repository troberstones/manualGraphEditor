<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Editor</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="fileBrowser.css">
    <link rel="stylesheet" href="layerEditor.css">
</head>

<body>
    <header>
        <div class="menu-item" id="menu-file">File</div>
        <div class="menu-item" id="menu-new">New Project</div>
        <div class="menu-item" id="menu-save">Save</div>
        <div class="menu-item">Edit</div>
        <div class="menu-item">View</div>
        <div class="menu-item">Help</div>
        <div class="menu-item" id="menu-render">Render</div>

    </header>
    <div id="LeftPaneTabSelector">
        <div id="tabSelector">
            <div class="tab-item" id="objectListTab">Object List</div>
            <div class="tab-item" id="layersStackTab">Layers Stack</div>
        </div>
        <div id="paneScrollContainer">
            <div id="objectList" class="sidebar">
                <div class="sidebar-header hidden">Object List</div>
                <div class="sidebar-content">
                    <!-- Object list items will go here -->
                    <p style="color: var(--text-secondary); font-style: italic;">No objects</p>
                </div>
            </div>

            <div id="layersStack" class="sidebar">
                <div class="sidebar-header hidden">Layers Stack</div>
                <div class="layerStackMenuButtons">
                    <div class="layerStackMenuButton" id="addBaseMaterialBtn" title="Add Base Material">Base Material +
                    </div>
                    <div class="layerStackMenuButton icon-button" id="fillLayerBtn" title="Add Fill Layer">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M19.22,4.38L17.17,2.33C16.89,2.05 16.5,2.05 16.22,2.33L3,15.55L10,22.55L23.22,9.33L21,6.5L19.22,4.38M10.88,19.83L5.61,14.56L16.66,3.5L21.93,8.77L10.88,19.83M12,18.5V20.5H20V18.5H12Z" />
                        </svg>
                    </div>
                </div>
                <div class="sidebar-content">
                    <!-- Layers will go here -->
                    <p style="color: var(--text-secondary); font-style: italic;">No layers</p>
                </div>
            </div>
        </div>
    </div>

    <main>
        <canvas id="canvas"></canvas>
    </main>

    <div id="properties" class="sidebar">
        <div class="sidebar-header">Properties</div>
        <div class="sidebar-content">
            <!-- Properties will go here -->
            <p style="color: var(--text-secondary); font-style: italic;">Select an object</p>
        </div>
    </div>

    <footer>
        <div class="status-item">Ready</div>
        <div class="status-item">Zoom: 100%</div>
    </footer>

    <script src="globals.js"></script>
    <script src="utils.js"></script>
    <script src="models.js"></script>
    <script src="scene.js"></script>
    <script src="renderer.js"></script>
    <script src="interaction.js"></script>
    <script src="fileBrowser.js"></script>
    <script src="layerEditor.js"></script>
    <script src="ui-library.js"></script>
    <script src="ui-properties.js"></script>
    <script src="io.js"></script>
    <script src="main.js"></script>
</body>

</html>
